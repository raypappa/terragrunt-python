name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff check
        uses: astral-sh/ruff-action@v4.1.0

      - name: Check Ruff formatting
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check

      - name: Run ty
        run: uv run ty check

      - name: Run tests
        run: uv run pytest

      - name: Verify Terragrunt capabilities
        run: uv run python tools/verify_capabilities.py
